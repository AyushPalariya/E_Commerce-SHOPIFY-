<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify | My Profile</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Styling/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <style>
        .profile-header {
            background: linear-gradient(135deg, var(--navbar-bg), var(--secondary-solor));
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-top: 100px;
            text-align: center;
        }
        .profile-avatar {
            width: 120px;
            height: 120px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(255, 102, 0, 0.4);
        }
        .order-card {
            background-color: var(--secondary-solor);
            border-left: 5px solid var(--primary-color);
            margin-bottom: 20px;
            border-radius: 10px;
            padding: 20px;
        }
        .badge-pending { background-color: #ffc107; color: black; }
        .badge-completed { background-color: #28a745; color: white; }
    </style>
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bolder" href="index.html"><img src="images/logog.png" alt="brand" height="30px" width="35px"> SHOPIFY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge">0</span></a></li>
                    <li class="nav-item" id="authSection">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar"><i class="fa-solid fa-user"></i></div>
            <h2 id="profileName">Loading User...</h2>
            <p id="profileEmail" class="text-white-50 mb-1"><i class="fa-solid fa-envelope"></i> Loading Email...</p>
            <p id="profilePhone" class="text-white-50"><i class="fa-solid fa-phone"></i> Loading Phone...</p>
            <button id="logoutBtn" class="btn btn-outline-danger mt-3 px-5 rounded-pill"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
        </div>


    </div>

    <!-- footer -->
    <footer class="footer mt-5">
        <div class="container">
            <p class="copyright">© 2025 Shopify</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/navbar-auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/myProfile.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
