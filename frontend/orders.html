<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify | My Orders</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Styling/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <style>
        .order-card {
            background-color: var(--secondary-solor);
            border-left: 5px solid var(--primary-color);
            margin-bottom: 20px;
            border-radius: 10px;
            padding: 20px;
        }
        .badge-pending { background-color: #ffc107; color: black; }
        .badge-completed { background-color: #28a745; color: white; }
    </style>
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bolder" href="index.html"><img src="images/logog.png" alt="brand" height="30px" width="35px"> SHOPIFY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge">0</span></a></li>
                    <li class="nav-item" id="authSection">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mb-5" style="margin-top: 100px;">
        <h3 class="section-title text-start mt-5"><i class="fa-solid fa-box-open"></i> My Order History</h3>
        
        <div id="ordersContainer">
            <div class="text-center mt-5">
                <div class="spinner-border text-warning" role="status"></div>
                <p class="mt-2 text-muted">Loading your amazing purchases...</p>
            </div>
        </div>
    </div>

    <!-- footer -->
    <footer class="footer mt-5">
        <div class="container">
            <p class="copyright">© 2025 Shopify</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/navbar-auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
