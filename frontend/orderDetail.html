<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details</title>
    <!-- bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Styling/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bolder" href="index.html"><img src="images/logog.png" alt="brand" height="30px" width="35px"> SHOPIFY</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html"><i class="fa-solid fa-cart-shopping"></i><span class="cart-badge">0</span></a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 pt-5">
        <h2 class="section-title text-success my-4"><i class="fa-solid fa-check-circle"></i> Payment Successful!</h2>
        <div class="card bg-dark text-white p-4">
            <h4>Order Details</h4>
            <div id="order-info" class="mb-4"></div>
            
            <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="order-items">
                </tbody>
            </table>
            <h3 class="text-end">Total Paid: Rs. <span id="order-total">0</span></h3>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            let lastOrder = JSON.parse(sessionStorage.getItem('lastOrder'));
            if (!lastOrder) {
                document.querySelector('.container').innerHTML = "<h3 class='mt-5 pt-5 text-center'>No recent order found!</h3>";
                return;
            }
            
            let infoDiv = document.getElementById('order-info');
            infoDiv.innerHTML = `
                <p><strong>Name:</strong> ${lastOrder.username}</p>
                <p><strong>Email:</strong> ${lastOrder.email}</p>
                <p><strong>Status:</strong> ${lastOrder.status}</p>
            `;

            let tbody = document.getElementById('order-items');
            lastOrder.orderItemDTO.forEach(item => {
                let subtotal = item.productPrice * item.quantity;
                tbody.innerHTML += `
                    <tr>
                        <td>${item.productName}</td>
                        <td>${item.productPrice}</td>
                        <td>${item.quantity}</td>
                        <td>Rs. ${subtotal}</td>
                    </tr>
                `;
            });

            document.getElementById('order-total').innerText = lastOrder.totalAmount;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
